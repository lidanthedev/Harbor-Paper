# Harbor (Paper port of RealTriassic/Harbor)
# Whole rootfs lives in plugins/Harbor/container, marker file .installed included.
# Silent by default: only fine-level logging, no banner. GoTTY is opt-in
# (gotty.enabled, off by default) and opens no port until you turn it on.
#
# This one file is read in both modes:
#   * plugin  - Paper loads plugins/Harbor-<version>.jar and registers /sh + /harbor
#   * standalone - the jar launched directly (java -jar, e.g. renamed server.jar):
#     plugins/Harbor is still created next to the jar, and every line typed into
#     the console is run in the rootfs ("/harbor ..." manages Harbor).

# Even while silent, a startup pass slower than about 10s prints one summary
# line ("[Harbor] startup finished after 42s", preceded by the dropbear line)
# so a slow first boot or dropbear setup is never indistinguishable from a hang.
silent: true

# Pinned versions (bump together).
# v3.18 pins 404 upstream (apk-tools-static pruned from CDN), so we track Alpine 3.22:
# minirootfs 3.22.6 + apk-tools-static 2.14.12-r0 verified on dl-cdn 2026-10-17.
# Alpine 3.22 branch: https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/
alpine-version: "3.22"
alpine-full-version: "3.22.6"
apk-tools-version: "2.14.12-r0"
proot-version: "5.3.0"

# proot's --link2symlink emulates hard links with symlinks. It is only needed on
# filesystems that cannot create real hard links (some FUSE/exFAT mounts). On a
# normal ext4/overlayfs volume it is actively harmful: installing packages that
# ship hardlinked binaries (gcc, g++, binutils, ...) fails with "Operation not
# permitted" / "failed to rename", because proot leaves broken .l2s.* symlink
# chains behind. Off by default; enable only if `apk add` reports hard-link
# errors on your filesystem.
proot-link2symlink: false

# Bind the server's real working directory ($PWD, i.e. the Pterodactyl
# /home/container volume) into the rootfs at this path, so /sh can read and
# write the actual server files directly:
#   /sh ls /mnt
#   /sh cat /mnt/server.properties
#   /sh cp /mnt/server.jar /root/backup.jar
# The guest path does not need to exist (proot bindings are path substitutions,
# not real mounts). Set to "" to disable. proot is not a sandbox either way, so
# this only makes the existing access convenient -- see
# docs/CONTAINER-LIMITS.md.
real-pwd-mount: "/mnt"

# Seconds before /sh is killed. 0 = no timeout (wait as long as it takes).
# Output capture is capped at 8 MiB per command regardless.
command-timeout-seconds: 0

# DNS written to container/etc/resolv.conf on install.
dns:
  - "1.1.1.1"
  - "1.0.0.1"

# ---------------------------------------------------------------------------
# Auto dropbear (SSH into the container) in an unprivileged container.
#
# The container is unprivileged, which breaks the normal path in three ways and
# this setup compensates automatically:
#   * dropbearkey cannot write keys (container seccomp blocks getrandom)
#     -> host keys are generated with OpenSSH `ssh-keygen -A` instead
#   * dropbear needs its own key format / the right subpackage
#     -> `apk add dropbear dropbear-convert` + `dropbearconvert`
#   * dropbear resolves the user home from /etc/passwd, not $HOME
#     -> authorized_keys is written to /root/.ssh/authorized_keys
#
# Runs on every boot after the rootfs exists. Disable with enabled: false.
# ---------------------------------------------------------------------------
dropbear:
  enabled: true
  # High port; you cannot bind 22 in an unprivileged container. Expose this
  # port in the panel to reach it from outside.
  port: 25584
  # paste the contents of your client's id_ed25519.pub here (single line).
  # Leave empty to keep whatever already exists in /root/.ssh/authorized_keys.
  authorized-key: ""
  # false = key-only auth (-g), which is what you want. true only for debugging.
  allow-password-login: false

# ---------------------------------------------------------------------------
# Optional GoTTY: a browser terminal into the rootfs. Disabled by default.
#
# GoTTY serves an interactive shell over HTTP on the given port, so anyone who
# can reach that port gets root inside the container - full read/write on the
# server files, exactly like /sh and dropbear (see docs/CONTAINER-LIMITS.md).
# Keep it off unless you need it; when you enable it, set a password and expose
# the port only where you trust it. Plain HTTP: the password travels in clear.
#
# The binary is fetched from the GoTTY release the first time it actually runs,
# never at install time, so a default install downloads nothing extra. It lives
# at /usr/local/bin/gotty inside the rootfs and logs to /root/.harbor/gotty.log.
# Manage it at runtime with /harbor gotty <start|stop>.
# ---------------------------------------------------------------------------
gotty:
  enabled: false
  # Cannot bind ports below 1024 in this container. The panel must expose it
  # the same way it exposes the dropbear port.
  port: 8080
  # HTTP basic auth ("<username>:<password>"). An empty password means NO
  # authentication at all: the root shell is open to anyone who can reach the
  # port, and Harbor says so in the boot line.
  username: "harbor"
  password: ""
  # true = browsers can type into the shell (needed to actually use it).
  # false = read-only view of the terminal output.
  permit-write: true
  # GoTTY release fetched on first use (sorenisanerd/gotty, linux amd64/arm64).
  version: "1.5.0"

# ---------------------------------------------------------------------------
# Commands run inside the rootfs, in order, in the background, once per boot
# after install and dropbear setup. Each entry is passed to /bin/sh -c.
# $HOME inside these commands is /root. Use "#" for comments.
# ---------------------------------------------------------------------------
startup-commands:
  - "echo harbor booted at $(date)"
  # - "dropbear -E -K 60 -p 25584 -r /etc/dropbear/dropbear_ed25519_host_key"
  # - "python3 -m http.server 8000 --directory /root"

# ---------------------------------------------------------------------------
# Hosting panels (Pterodactyl and friends) decide a server is "running" when the
# console prints the Minecraft-style "Done (Ns)!" line, and the standard eggs
# match exactly that text. A standalone Harbor never prints one, so the panel
# sits on "starting" forever. Rather than faking it with a startup-command (a
# fixed number that is a lie), set the line here, with %d where the elapsed
# seconds go, and Harbor prints it itself when the boot pass finishes:
#
#   panel-done-line: 'Done (%ds)! For help, type "help"'
#
# %d is the real time from the start of the pass to the end of the boot, so the
# number in the panel's console is true. The line is printed raw, with no
# "[Harbor]" prefix, because the panel matches the console text as-is.
# Empty (default) prints nothing. Standalone mode only.
# ---------------------------------------------------------------------------
panel-done-line: ""
