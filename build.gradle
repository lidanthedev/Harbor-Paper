plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'dev.triassic'
version = '1.1.2'
description = 'Run Alpine Linux minirootfs inside plugins/Harbor with /sh. Paper port of RealTriassic/Harbor.'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    // Bundled + relocated so the same jar also runs standalone (as server.jar)
    // with no Bukkit on the classpath. Relocation keeps it clear of the copy
    // Paper ships in plugin mode.
    implementation 'org.yaml:snakeyaml:2.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// One jar, two entry points:
//   * in plugins/  -> normal Paper plugin (plugin.yml -> HarborPlugin)
//   * java -jar    -> standalone shell box (Main-Class -> HarborMain)
tasks.named('jar') { enabled = false }
tasks.named('assemble') { dependsOn tasks.named('shadowJar') }

shadowJar {
    archiveBaseName = 'Harbor'
    archiveClassifier = ''
    relocate 'org.yaml.snakeyaml', 'dev.triassic.harbor.lib.snakeyaml'
    mergeServiceFiles()
    manifest {
        attributes(
                'Main-Class': 'dev.triassic.harbor.HarborMain',
                'Implementation-Title': 'Harbor',
                'Implementation-Version': project.version
        )
    }
}
